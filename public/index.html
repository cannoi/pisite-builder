<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiSite Builder - Trình Tạo Website Doanh Nghiệp</title>
  <link rel="stylesheet" href="style.css">
<style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <h2>🌐 PiSite Builder</h2>
        <p>Tạo website không cần lập trình</p>
      </div>
      <div class="site-list-header">
        <h3>Dự án của bạn</h3>
        <button class="btn-primary" onclick="createNewSite()">+ Tạo mới</button>
      </div>
      <div id="sitesList" class="sites-list">
        <!-- Sites loaded dynamically -->
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div class="editor-title" id="editorHeaderTitle">Chọn một dự án để bắt đầu</div>
        <div class="top-actions">
          <button class="btn-secondary" onclick="setPreviewMode('desktop')" id="btnDesktop">💻 Desktop</button>
          <button class="btn-secondary" onclick="setPreviewMode('mobile')" id="btnMobile">📱 Mobile</button>
          <button class="btn-accent" onclick="exportCurrentSite()" id="btnExport" style="display:none;">📥 Tải xuống HTML</button>
          <button class="btn-primary" onclick="saveCurrentSite()" id="btnSave" style="display:none;">💾 Lưu thay đổi</button>
        </div>
      </header>

      <div class="workspace">
        <div class="editor-pane" id="editorPane" style="display:none;">
          <div class="form-group">
            <label>Tên doanh nghiệp / Tiêu đề</label>
            <input type="text" id="siteTitle" placeholder="Ví dụ: Công ty TNHH Giải pháp Số">
          </div>
          <div class="form-group">
            <label>Khẩu hiệu (Subtitle)</label>
            <input type="text" id="siteSubtitle" placeholder="Ví dụ: Nền tảng công nghệ tin cậy cho mọi nhà">
          </div>
          <div class="form-group">
            <label>Màu chủ đạo (Theme Color)</label>
            <div class="color-picker-row">
              <input type="color" id="siteColor" value="#2563eb">
              <span id="colorCode">#2563eb</span>
            </div>
          </div>
          <div class="form-group">
            <label>Giới thiệu (About)</label>
            <textarea id="siteAbout" rows="4" placeholder="Mô tả về doanh nghiệp hoặc dịch vụ..."></textarea>
          </div>
          <div class="form-group">
            <label>Email liên hệ</label>
            <input type="email" id="siteEmail" placeholder="contact@doanhnghiep.vn">
          </div>
          <div class="form-group">
            <div class="services-header">
              <label>Dịch vụ / Sản phẩm</label>
              <button class="btn-small" onclick="addServiceRow()">+ Thêm dịch vụ</button>
            </div>
            <div id="servicesContainer">
              <!-- Service rows -->
            </div>
          </div>
        </div>

        <div class="preview-pane">
          <div class="preview-wrapper desktop" id="previewWrapper">
            <iframe id="previewFrame" src="about:blank"></iframe>
          </div>
        </div>
      </div>
    </main>
  </div>

  
  <script src="app.js"></script>
<img class="paf-made-by" src="/made-by.png" alt="Made with App Builder — Pi SoloHost"></body>
</html>
